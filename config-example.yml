# Best Auction plugin configuration example
# Copy this file to config.yml to use it

# Language settings (en: English)
language: "en"

# Auction settings
auction:
  # Default auction duration (hours)
  default_duration: 168  # 7 days
  
  # Listing fee rate (0.05 = 5%)
  listing_fee_rate: 0.05
  
  # Minimum listing fee
  min_listing_fee: 10
  
  # Maximum listing fee
  max_listing_fee: 10000
  
  # Minimum bid price
  min_price: 1
  
  # Maximum bid price
  max_price: 1000000000
  
  # Maximum simultaneous listings per player
  max_player_listings: 7

# Currency settings
currency:
  # Currency formatting through Vault (recommended)
  use_vault_format: true
  
  # Fallback currency name when Vault is unavailable
  fallback_currency: "gil"
  
  # Currency symbol (used when use_vault_format is false)
  currency_symbol: ""

# UI settings
ui:
  # Items per page in the auction house
  items_per_page: 45
  
  # Maximum search results to display
  max_search_results: 100
  
  # Date format
  # Examples: "yyyy-MM-dd", "MM/dd/yyyy", "dd/MM/yyyy", "MMMM dd, yyyy"
  date_format: "yyyy-MM-dd"

# Mail settings
mail:
  # Maximum stored mail per player
  max_mail_per_player: 50
  
  # Days until automatic mail deletion (0 = never)
  auto_delete_days: 30

# Permission settings
permissions:
  # Require permission to use the auction house
  require_permission: false
  
  # Base permission node
  base_permission: "bestauction.use"

# Debug settings
debug:
  # Enable debug commands (development/testing environments only)
  # WARNING: Always set to false in production
  enable_debug_commands: false

# =========================================
# Cloud integration settings (optional)
# =========================================
cloud:
  # Enable cloud integration
  enabled: false  # Change to true to enable
  
  # Cloudflare Workers base URL
  # Example: https://best-auction.your-username.workers.dev
  base_url: "https://your-worker.your-subdomain.workers.dev"
  
  # API token (required - obtain from the cloud dashboard)
  # Run “ah cloud gettoken” in the console for instructions
  api_token: ""
  
  # Server identifier (to distinguish multiple servers)
  server_id: "server-1"
  
  # Authentication settings
  auth:
    # Automatically validate the token on startup
    validate_on_startup: true
    
    # Token revalidation interval (minutes, 0 = disabled)
    revalidate_interval: 60
  
  # Data synchronization settings
  sync:
    # Automatically synchronize existing data on first startup (if the token is valid)
    auto_sync_on_startup: true
    
    # Initial synchronization batch size (auctions per request)
    batch_size: 50
    
    # Delay between batch requests (milliseconds)
    batch_delay: 1000
    
    # Synchronize bids along with auctions
    include_bids: true
    
    # Force full resynchronization (ignore the last synchronization timestamp)
    force_full_sync: false
  
  # HTTP request timeout (milliseconds)
  timeout: 5000
  
  # Retry attempts for failed requests
  retry_attempts: 3
  
  # Delay between retries (milliseconds)
  retry_delay: 1000
  
  # Events sent to the cloud (individual events can be disabled)
  events:
    item_listed: true      # When an item is listed
    bid_placed: true       # When a bid is placed
    bid_cancelled: true    # When a bid is cancelled
    auction_cancelled: true # When an auction is cancelled
    item_sold: true        # When an item is sold